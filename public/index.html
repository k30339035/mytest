<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKS VM Schedule Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AKS Virtual Machine Schedule Manager</h1>
            <div id="current-context" class="context-info">
                <span class="loading">Azure 연결 확인 중...</span>
            </div>
        </header>

        <main>
            <!-- 리소스 선택 섹션 -->
            <section class="resource-selection">
                <h2>리소스 선택</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="subscription">구독 (Subscription)</label>
                        <select id="subscription">
                            <option value="">구독 선택...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="resource-group">리소스 그룹</label>
                        <select id="resource-group">
                            <option value="">리소스 그룹 선택...</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="automation-account">Automation Account</label>
                        <input type="text" id="automation-account" placeholder="Automation Account 이름 입력">
                    </div>
                    <div class="form-group">
                        <button id="load-resources-btn" class="btn btn-primary">리소스 로드</button>
                    </div>
                </div>
            </section>

            <!-- AKS 클러스터 및 VMSS 정보 -->
            <section class="resources-info">
                <div class="info-grid">
                    <div class="info-card">
                        <h3>AKS 클러스터</h3>
                        <div id="aks-clusters" class="resource-list">
                            <p class="placeholder">리소스를 로드하세요</p>
                        </div>
                    </div>
                    <div class="info-card">
                        <h3>VMSS (Virtual Machine Scale Sets)</h3>
                        <div id="vmss-list" class="resource-list">
                            <p class="placeholder">리소스를 로드하세요</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 스케줄 관리 섹션 -->
            <section class="schedule-management">
                <div class="section-header">
                    <h2>스케줄 관리</h2>
                    <button id="add-schedule-btn" class="btn btn-success">+ 새 스케줄 추가</button>
                </div>

                <div id="schedules-container" class="schedules-grid">
                    <p class="placeholder">Automation Account를 선택하고 리소스를 로드하세요</p>
                </div>
            </section>

            <!-- VMSS 즉시 스케일 조정 -->
            <section class="quick-scale">
                <h2>즉시 스케일 조정</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="vmss-select">VMSS 선택</label>
                        <select id="vmss-select">
                            <option value="">VMSS 선택...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="capacity">인스턴스 수</label>
                        <input type="number" id="capacity" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <button id="scale-btn" class="btn btn-warning">스케일 조정 실행</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 모달: 스케줄 추가/편집 -->
    <div id="schedule-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">새 스케줄 추가</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="schedule-form">
                    <div class="form-group">
                        <label for="schedule-name">스케줄 이름 *</label>
                        <input type="text" id="schedule-name" required>
                    </div>
                    <div class="form-group">
                        <label for="schedule-description">설명</label>
                        <textarea id="schedule-description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="start-time">시작 시간 *</label>
                        <input type="datetime-local" id="start-time" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="frequency">빈도 *</label>
                            <select id="frequency" required>
                                <option value="OneTime">한 번</option>
                                <option value="Day">매일</option>
                                <option value="Hour">매시간</option>
                                <option value="Week">매주</option>
                                <option value="Month">매월</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="interval">간격</label>
                            <input type="number" id="interval" min="1" placeholder="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="timezone">시간대</label>
                        <select id="timezone">
                            <option value="Asia/Seoul">Asia/Seoul (KST)</option>
                            <option value="UTC">UTC</option>
                            <option value="America/New_York">America/New_York (EST)</option>
                            <option value="Europe/London">Europe/London (GMT)</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary cancel-btn">취소</button>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 알림 토스트 -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
